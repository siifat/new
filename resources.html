<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UIU Resources — Sifat Ullah</title>
<meta name="description" content="Course materials, class tests, finals and academic links for UIU students." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css" />
<script>
  try {
    var t = localStorage.getItem('site-theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch (e) {}
</script>
</head>
<body data-page="resources">

  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-name" data-bind="siteName">Sifat Ullah</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="resources.html" aria-current="page">UIU Resources</a>
        <a href="blogs.html">Blogs</a>
        <a href="help.html">Help</a>
      </nav>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle colour theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p class="footer-note">
        © <span id="year"></span> <span data-bind="siteName">Sifat Ullah</span>
        <span class="dot">·</span> <span data-bind="footerNote"></span>
      </p>
      <nav class="footer-links" id="socialLinks" aria-label="Social"></nav>
    </div>
  </footer>

  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/materials-index.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
